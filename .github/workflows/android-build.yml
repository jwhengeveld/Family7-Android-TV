name: Android CI / Build & Package

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# Standaard is de token van een workflow alleen-lezen; zonder dit recht kan de
# stap "Publish Release" geen release aanmaken (HTTP 403).
permissions:
  contents: write

jobs:
  build:
    name: Build, Test & Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      # De ondertekeningsgegevens staan als repository secrets in GitHub, niet in
      # de repo. Zonder die secrets (bijvoorbeeld in een pull request van een fork)
      # wordt alleen de debug-APK gebouwd.
      - name: Restore Signing Key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Geen ondertekeningsgegevens beschikbaar; alleen debug-build."
            exit 0
          fi
          mkdir -p keystore
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > keystore/family7-release.jks
          {
            echo "storeFile=keystore/family7-release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest testReleaseUnitTest --stacktrace

      - name: Upload Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 7

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      # De APK is voor zijlading op een tv of Portal; de AAB is wat Google Play
      # accepteert. Beide komen uit dezelfde ondertekende build.
      - name: Build Signed Release APK and Bundle
        if: ${{ hashFiles('keystore/family7-release.jks') != '' }}
        run: ./gradlew assembleRelease bundleRelease --stacktrace

      - name: Verify Release Signature
        if: ${{ hashFiles('keystore/family7-release.jks') != '' }}
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          APK=app/build/outputs/apk/release/app-release.apk
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          # Een release mag nooit debuggable zijn.
          AAPT2=$(find "$ANDROID_HOME/build-tools" -name aapt2 | sort -V | tail -1)
          if "$AAPT2" dump badging "$APK" | grep -q "application-debuggable"; then
            echo "::error::De release-APK is debuggable"
            exit 1
          fi
          # En hij mag geen onversleuteld verkeer toestaan.
          if "$AAPT2" dump xmltree "$APK" --file AndroidManifest.xml | grep -q "usesCleartextTraffic.*0xffffffff"; then
            echo "::error::De release staat onversleuteld verkeer toe"
            exit 1
          fi
          # De bundel moet er zijn en ondertekend.
          test -f app/build/outputs/bundle/release/app-release.aab

      - name: Name Release Artifacts
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cp app/build/outputs/apk/release/app-release.apk "family7-androidtv-v${VERSION}.apk"
          cp app/build/outputs/bundle/release/app-release.aab "family7-androidtv-v${VERSION}.aab"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: family7-androidtv
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14

      # Een tag v* levert meteen een release met de ondertekende bestanden erbij.
      - name: Publish Release with Artifacts
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          APK="family7-androidtv-v${VERSION}.apk"
          AAB="family7-androidtv-v${VERSION}.aab"
          # Maak de release aan als hij nog niet bestaat; anders alleen de bestanden erbij.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$APK" "$AAB" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$APK" "$AAB" \
              --title "Family7 Android TV $GITHUB_REF_NAME" \
              --generate-notes
          fi

      - name: Clean Up Signing Key
        if: always()
        run: rm -f keystore/family7-release.jks keystore.properties

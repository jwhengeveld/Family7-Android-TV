name: Android CI / APK Build

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      # De ondertekeningsgegevens staan als repository secrets in GitHub, niet in
      # de repo. Zonder die secrets (bijvoorbeeld in een pull request van een fork)
      # wordt alleen de debug-APK gebouwd.
      - name: Restore Signing Key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Geen ondertekeningsgegevens beschikbaar; alleen debug-build."
            exit 0
          fi
          mkdir -p keystore
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > keystore/family7-release.jks
          {
            echo "storeFile=keystore/family7-release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest

      - name: Build Signed Release APK
        if: ${{ hashFiles('keystore/family7-release.jks') != '' }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Verify Release Signature
        if: ${{ hashFiles('keystore/family7-release.jks') != '' }}
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          APK=app/build/outputs/apk/release/app-release.apk
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          # Een release mag nooit debuggable zijn.
          AAPT2=$(find "$ANDROID_HOME/build-tools" -name aapt2 | sort -V | tail -1)
          if "$AAPT2" dump badging "$APK" | grep -q "application-debuggable"; then
            echo "::error::De release-APK is debuggable"
            exit 1
          fi

      - name: Name Release APK
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cp app/build/outputs/apk/release/app-release.apk "family7-androidtv-v${VERSION}.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: family7-androidtv-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

      # Een tag v* levert meteen een release met de ondertekende APK erbij.
      - name: Publish Release with APK
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          APK="family7-androidtv-v${VERSION}.apk"
          # Maak de release aan als hij nog niet bestaat; anders alleen de APK erbij.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$APK" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$APK" \
              --title "Family7 Android TV $GITHUB_REF_NAME" \
              --generate-notes
          fi

      - name: Clean Up Signing Key
        if: always()
        run: rm -f keystore/family7-release.jks keystore.properties
